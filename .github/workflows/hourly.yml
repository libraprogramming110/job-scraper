name: hourly-olj-sweep

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-olj
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write Telegram config from secrets
        run: echo "{\"token\":\"${{ secrets.TELEGRAM_TOKEN }}\",\"chatId\":\"${{ secrets.TELEGRAM_CHAT_ID }}\"}" > telegram.json

      - name: Sweep OnlineJobs.PH (part-time only)
        run: node src/cli.mjs --source onlinejobsph --all

      - name: Commit dedup state back
        run: |
          git config user.name "job-scraper bot"
          git config user.email "actions@github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen.json"
          git push
